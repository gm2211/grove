name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      # The Nomad mTLS integration test (internal/install) runs grove's rendered configs against
      # the real Nomad release the control plane installs; it skips without GROVE_NOMAD_BIN.
      - name: Install Nomad for integration tests
        if: runner.os == 'Linux'
        run: |
          version=$(sed -n 's/^\tNomadVersion = "\(.*\)"$/\1/p' internal/install/download.go)
          sum=$(sed -n 's/^\t"linux\/amd64": *"\([0-9a-f]*\)",$/\1/p' internal/install/download.go)
          curl -fsSL -o "$RUNNER_TEMP/nomad.zip" "https://releases.hashicorp.com/nomad/${version}/nomad_${version}_linux_amd64.zip"
          echo "$sum  $RUNNER_TEMP/nomad.zip" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/nomad.zip" nomad -d "$RUNNER_TEMP"
          echo "GROVE_NOMAD_BIN=$RUNNER_TEMP/nomad" >> "$GITHUB_ENV"

      # The worker Mac's VM firewall test (internal/install) loads its pf anchor on the macOS
      # runner for real, and takes it out again; it skips without GROVE_PF_TEST.
      - name: Allow the real-pf test
        if: runner.os == 'macOS'
        run: echo "GROVE_PF_TEST=1" >> "$GITHUB_ENV"

      - run: go test ./...

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: has-ui
        run: |
          if [ -f ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.has-ui.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - if: steps.has-ui.outputs.present == 'true'
        working-directory: ui
        run: |
          npm ci
          npm run build
