name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      # The Nomad mTLS integration test (internal/install) runs grove's rendered configs against
      # the real Nomad release the control plane installs; it skips without GROVE_NOMAD_BIN.
      - name: Install Nomad for integration tests
        if: runner.os == 'Linux'
        run: |
          version=$(sed -n 's/^\tNomadVersion = "\(.*\)"$/\1/p' internal/install/download.go)
          sum=$(sed -n 's/^\t"linux\/amd64": *"\([0-9a-f]*\)",$/\1/p' internal/install/download.go)
          curl -fsSL -o "$RUNNER_TEMP/nomad.zip" "https://releases.hashicorp.com/nomad/${version}/nomad_${version}_linux_amd64.zip"
          echo "$sum  $RUNNER_TEMP/nomad.zip" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/nomad.zip" nomad -d "$RUNNER_TEMP"
          echo "GROVE_NOMAD_BIN=$RUNNER_TEMP/nomad" >> "$GITHUB_ENV"

      # The worker Mac's VM firewall test (internal/install) loads its pf anchor on the macOS
      # runner for real, and takes it out again; it skips without GROVE_PF_TEST, and runs verbosely
      # here so the log shows it ran.
      - name: Load the worker Mac's VM firewall on real pf
        if: runner.os == 'macOS'
        run: |
          echo "GROVE_PF_TEST=1" >> "$GITHUB_ENV"
          GROVE_PF_TEST=1 go test -v -count=1 -run '^TestHostFirewallLoader_RealPF$' ./internal/install

      - run: go test ./...

  # spec/: the 20 properties of spec/README.md, model-checked (Quint + TLC), proved (Lean) and
  # queried (CodeQL), and pinned to the Go code. Every tool is pinned by version and checksum.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Quint, TLC, Lean, CodeQL and Specify
        run: |
          npm install --global @informalsystems/quint@0.33.1
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          echo "TLA2TOOLS_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/lean.zip" https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.zip
          echo "c8531faaa4a93d5a4dae0c742cbc1bd42a2993594d02f93a9d629ebf299fb2c8  $RUNNER_TEMP/lean.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lean.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/codeql.tar.gz" https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-linux64.tar.gz
          echo "64518dc413c8e7b5733fee2489e830a899bb1e3f28c8873b5869d5cc90164c5c  $RUNNER_TEMP/codeql.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/codeql.tar.gz" -C "$RUNNER_TEMP"
          echo "CODEQL=$RUNNER_TEMP/codeql/codeql" >> "$GITHUB_ENV"
          git init -q "$RUNNER_TEMP/specify" && git -C "$RUNNER_TEMP/specify" fetch -q --depth 1 https://github.com/gm2211/specify d5e1894cf5b8772011bf961a0cfb6ba538279a54
          git -C "$RUNNER_TEMP/specify" checkout -q FETCH_HEAD
          (cd "$RUNNER_TEMP/specify" && npm ci --silent && npm run -s build)
          echo "SPECIFY=$RUNNER_TEMP/specify/specify" >> "$GITHUB_ENV"

      - run: spec/check.sh

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: has-ui
        run: |
          if [ -f ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.has-ui.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - if: steps.has-ui.outputs.present == 'true'
        working-directory: ui
        run: |
          npm ci
          npm run build
