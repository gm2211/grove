name: images

# Builds and pushes images/runner (the default container for linux build/agent/shell jobs) on
# changes to it. The Tart worker images (images/macos-worker, images/linux-worker) CANNOT be built
# here: Tart is built on Apple's Virtualization.framework and only runs on Apple Silicon Macs,
# which GitHub-hosted runners are not (even the macos-14 arm64 runners run inside a VM that
# doesn't support nested virtualization). Build those locally with `make images` — see
# docs/IMAGES.md.

on:
  push:
    branches: [main]
    paths:
      - "images/runner/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "images/runner/**"
      - ".github/workflows/images.yml"
  workflow_dispatch: {}

# Only pushes to main get packages: write. A pull request's Dockerfile is code nobody has reviewed
# yet, and same-repo PRs (agent branches included) would otherwise build it next to a token that
# can overwrite the image every linux job runs in.
permissions:
  contents: read

jobs:
  check:
    name: build grove-runner (pull request, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU (cross-arch emulation for the amd64 leg on arm64 and vice versa)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/runner
          file: images/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha

  runner:
    name: build & push grove-runner
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU (cross-arch emulation for the amd64 leg on arm64 and vice versa)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/gm2211/grove-runner
          # latest moves with every push. sha-<commit> names the build of one commit (short, and in
          # full so it cannot collide). Neither is what grove runs by default: that is the digest
          # in internal/dispatch/nomadjobs.go (DefaultRunnerImage), which only a commit changes.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=sha,format=long

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/runner
          file: images/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is the only name of this build that cannot be moved. A pool can use it as its
      # runnerImage right away; it becomes grove's default only when DefaultRunnerImage is changed
      # to it (docs/IMAGES.md "The default runner image").
      - name: Report the pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          case "$DIGEST" in
          sha256:*) ;;
          *) echo "the build reported no digest: '$DIGEST'" >&2; exit 1 ;;
          esac
          {
            echo "### grove-runner"
            echo
            echo "Pushed \`ghcr.io/gm2211/grove-runner@${DIGEST}\`."
            echo
            echo "A pool can run it now: set that reference as the pool's \`runnerImage\` in fleet.yaml."
            echo "To make it grove's default, set \`DefaultRunnerImage\` in \`internal/dispatch/nomadjobs.go\` to it."
          } >> "$GITHUB_STEP_SUMMARY"
