name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # goreleaser pushes Formula/grove.rb back into this same repo (see .goreleaser.yaml's
          # `brews` block), so the default, repo-scoped GITHUB_TOKEN is enough — no separate
          # tap repo or personal access token needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
