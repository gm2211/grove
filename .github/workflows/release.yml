name: release

# A release is cut for a pushed v* tag, and for the tag autorelease.yml creates when main is green:
# a tag pushed with the workflow's own GITHUB_TOKEN does not start workflows, so autorelease.yml
# calls this one with the tag instead.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: The v* tag to release. It must already exist.
        required: true
        type: string

# Every action is pinned to a commit, with its release in the trailing comment: a tag can be moved
# to other code, a commit cannot. Resolve a new pin with
#   git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag> 'refs/tags/<tag>^{}'
# (the ^{} line, when there is one, is the commit of an annotated tag).
#
# Read-only by default: only the goreleaser job publishes, and it asks for what it needs itself.
permissions:
  contents: read

jobs:
  # Builds the Orchard fork at the commit internal/install/download.go pins (OrchardForkCommit,
  # read from there so the pin lives in one place) for every platform grove supports, so
  # `grove install` downloads it instead of needing Go. Orchard has no cgo (it is a plain Go
  # program; upstream releases it with CGO_ENABLED=0), so every target cross-compiles from Linux.
  orchard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: amd64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Fetch Orchard at the pinned commit
        run: |
          commit=$(sed -n 's/^\tOrchardForkCommit = "\([0-9a-f]\{40\}\)"$/\1/p' internal/install/download.go)
          [ -n "$commit" ] || { echo "OrchardForkCommit not found in internal/install/download.go" >&2; exit 1; }
          git init -q "$RUNNER_TEMP/orchard"
          cd "$RUNNER_TEMP/orchard"
          git fetch -q --depth 1 https://github.com/gm2211/orchard "$commit"
          git checkout -q FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$commit" ] || { echo "fetched commit is not $commit" >&2; exit 1; }
          echo "ORCHARD_COMMIT=$commit" >> "$GITHUB_ENV"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ runner.temp }}/orchard/go.mod
          cache: false

      - name: Build orchard_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/orchard"
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/out/orchard" ./cmd/orchard
          # Name the commit inside the archive too, for whoever unpacks it by hand.
          echo "$ORCHARD_COMMIT" > "$RUNNER_TEMP/out/ORCHARD_COMMIT"
          mkdir -p "$GITHUB_WORKSPACE/orchard-assets"
          tar -czf "$GITHUB_WORKSPACE/orchard-assets/orchard_${GOOS}_${GOARCH}.tar.gz" -C "$RUNNER_TEMP/out" orchard ORCHARD_COMMIT

      - name: Smoke-test the linux/amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          tar -xzf orchard-assets/orchard_linux_amd64.tar.gz -C "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/orchard" --help >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchard_${{ matrix.goos }}_${{ matrix.goarch }}
          path: orchard-assets/*.tar.gz
          if-no-files-found: error

  goreleaser:
    needs: orchard
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release, its assets, and Formula/grove.rb pushed back to main
      id-token: write # the OIDC token the provenance attestation is signed with
      attestations: write # storing that attestation with this repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The four Orchard archives built above; .goreleaser.yaml adds them to checksums.txt and
      # attaches them to this release.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: orchard_*
          path: orchard-assets
          merge-multiple: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build embedded UI
        working-directory: ui
        run: |
          npm ci
          npm run build
          touch ../internal/server/dist/.keep

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          # An exact GoReleaser release, not a range: the tool that builds and signs off the
          # release must not change under a tag push.
          version: "v2.20.1"
          args: release --clean
        env:
          # goreleaser pushes Formula/grove.rb back into this same repo (see .goreleaser.yaml's
          # `brews` block), so the default, repo-scoped GITHUB_TOKEN is enough — no separate
          # tap repo or personal access token needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build provenance for everything the release hands out: the grove archives, the Orchard
      # archives built by the job above, and checksums.txt that names them all. Each attestation is
      # signed with this run's OIDC identity (this workflow, this tag, this commit) and stored with
      # the repository, so `gh attestation verify <file> --repo gm2211/grove` (scripts/install.sh
      # does it when gh is there) tells an archive this workflow built from one swapped in later.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/grove_*.tar.gz
            dist/checksums.txt
            orchard-assets/orchard_*.tar.gz
