name: ui

on:
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
