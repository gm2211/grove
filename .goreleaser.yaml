version: 2

project_name: grove

before:
  hooks:
    - go mod tidy

builds:
  - id: grove
    main: ./cmd/grove
    binary: grove
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/gm2211/grove/internal/cli.Version={{ .Version }}

archives:
  - id: grove
    ids: [grove]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Publishes/updates Formula/grove.rb in THIS repo on every release, so it doubles as its own
# Homebrew tap (`brew tap gm2211/grove https://github.com/gm2211/grove`) — no separate
# gm2211/homebrew-tap repo or personal access token needed; the default GITHUB_TOKEN can push
# here.
brews:
  - name: grove
    repository:
      owner: gm2211
      name: grove
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_msg_template: "Formula: update grove to {{ .Tag }} [skip ci]"
    homepage: "https://github.com/gm2211/grove"
    description: "Your Macs as a private build/agent cloud: Tart VMs via Orchard, jobs via Nomad."
    license: "MIT"
    install: |
      bin.install "grove"
    test: |
      system "#{bin}/grove", "--version"
