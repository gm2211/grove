id: dispatch
name: Dispatching and retrying jobs
prose: >-
  A job is queued per pool, retried on lost attempts, and failed only when no worker could ever run
  it. Evicted attempts are free.
behaviors:
  - id: every-job-finishes
    description: Every job reaches a terminal state.
    details: L3. Temporal property (terminates in dispatch.qnt), checked by TLC in spec/check.sh.
    tags: [liveness, l3]
  - id: snooze-never-fails-a-job
    description: >-
      A job queued only because its pool's workers are snoozed is never failed for it, and runs once
      the snooze ends.
    details: >-
      L4. Failed before v0.1.28 in the up to 60 s between a snooze ending and the next fleet tick.
      The "runs once the snooze ends" half is temporal (runsAfterSnooze), checked by TLC; Go test
      TestL4 in internal/conformance.
    tags: [liveness, l4]
    formal:
      - tool: quint
        file: ../quint/dispatch.qnt
        main: dispatchFixed
        property: neverFailedForSnooze
        mode: simulate
        maxSteps: 30
        samples: 2000
        seed: 1
      - tool: quint
        file: ../quint/dispatch.qnt
        main: dispatchFixed
        property: neverLost
        mode: simulate
        maxSteps: 30
        samples: 2000
        seed: 1
  - id: sealed-jobs-terminate
    description: >-
      A sealed-pool job terminates, given that owners snooze its Macs and VMs drain only finitely
      often.
    details: L5. Temporal property (terminates in attempts.qnt), checked by TLC over 40,544 states.
    tags: [liveness, l5]
  - id: fair-attempt-accounting
    description: >-
      Evictions never count against a job, quarantine needs losses on two machines, and a job gets
      at most three counted attempts.
    details: S2. Attacker J (a job that crashes Macs). Exhaustive TLC check in spec/check.sh.
    tags: [security, s2]
    formal:
      - tool: quint
        file: ../quint/attempts.qnt
        main: attemptsRetry
        property: accounting
        mode: simulate
        maxSteps: 30
        samples: 2000
        seed: 1
  - id: job-image-is-allowlisted-and-pinned
    description: >-
      A shared-pool job's image is its pool's runner image or a digest-pinned image its pool
      allows (the control plane pins a tag to its digest at submit), chosen by the control
      plane; a job with an environment leaves its pool only for a macOS pool that accepts its
      control-plane-validated native toolchain; the clone token runs only in the runner image or
      the root source task.
    details: >-
      S11. Attacker J (a caller choosing its own image through the request's environment or its
      meta). A tag is accepted only for an allowed repository, and only once the control plane has
      resolved it to a digest through the registry (internal/registryauth); a tag it cannot
      resolve is refused, never used as it is. Submit refuses an environment with no registry, an
      unallowed repository, an unresolvable tag, a sealed pool, a macOS pool without a validated toolchain, or a non-build kind; fallbackTarget
      moves an environment job only to a macOS pool with toolchains enabled and only when it
      carries a toolchain; build.nomad.hcl's source task stays on the runner image. Go tests in
      internal/dispatch/environment_test.go, internal/dispatch/toolchain_test.go and
      nomad/jobs/nomadjobs_test.go.
    tags: [security, s11]
  - id: toolchain-cache-is-written-only-by-grovetool
    description: >-
      A toolchain cache entry is written only by _grovetool, from versions the control plane
      validated; the job user can't write it.
    details: >-
      S22. Attacker J (a caller choosing what the macOS worker installs, or poisoning the cache a
      later job runs from). Submit validates the toolchain (exact versions, fixed tools, known rust
      components, at most 1 KiB), re-marshals it and is the only place toolchain_json and
      toolchain_hash are set; a redispatch carries both unchanged. On the worker the installer
      runs as _grovetool from root-owned code and _grovejob can't write the cache. Go tests in
      internal/dispatch/toolchain_test.go and internal/fleet/isolation_test.go.
    tags: [security, s22]
