id: secrets
name: Where secrets may go
behaviors:
  - id: secrets-reach-one-place
    description: >-
      Job secrets, the private-repo token, broker credentials and node keys reach only their one
      allowed destination, never argv, a log, an API response, the job record or a VM spec.
    details: >-
      S10. Attackers J and C. Four CodeQL taint queries find no flow, and a coverage query finds
      each secret at its allowed destination (spec/codeql). Named secrets still travel in
      env_json, which this counts as allowed, so it says nothing about security review C2.
    tags: [security, s10]
