id: secrets
name: Where secrets may go
behaviors:
  - id: secrets-reach-one-place
    description: >-
      Job secrets, the private-repo token, the registry pull login, broker credentials and node
      keys reach only their one allowed destination, never argv, a log, an API response, the job
      record or a VM spec.
    details: >-
      S10. Attackers J and C. Five CodeQL taint queries find no flow, and a coverage query finds
      each secret at its allowed destination (spec/codeql). Named secrets and the private-repo
      token travel in the dispatch payload; dispatch meta (env_json included) is a leak sink for
      both.
    tags: [security, s10]
